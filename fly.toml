# fly.toml app configuration file generated for heartgrn-api on 2026-05-15T10:23:53+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'heartgrn-api'
primary_region = 'lhr'

[build]
  dockerfile = 'server/Dockerfile'

[http_service]
  internal_port = 8766
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 30
    soft_limit = 20

[checks]
  [checks.healthz]
    port = 8766
    type = 'http'
    interval = '1m0s'
    timeout = '5s'
    grace_period = '30s'
    method = 'get'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
  memory_mb = 512
