app = "heartgrn-api"
primary_region = "lhr"  # London — close to UK academic users; change to "iad" / "ams" as needed

[build]
  dockerfile = "server/Dockerfile"

[env]
  # CF_PAGES_ORIGIN is set with `fly secrets set CF_PAGES_ORIGIN=https://...`
  # so the running container CORS-allows the deployed frontend.

[http_service]
  internal_port = 8766
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0          # scale-to-zero on Fly free tier
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 30

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.healthz]
    type = "http"
    port = 8766
    method = "get"
    path = "/healthz"
    interval = "60s"
    timeout = "5s"
    grace_period = "30s"
